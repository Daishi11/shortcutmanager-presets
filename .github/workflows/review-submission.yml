name: Review community submissions

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing issue number to review'
        required: true
        type: number

# Default-branch code only; untrusted ZIP contents are never executed.
permissions:
  contents: read
  issues: write

concurrency:
  group: community-review-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  technical-review:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.comment.body == '/review' &&
      github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate submission ZIP without executing contents
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: python review_submission.py
